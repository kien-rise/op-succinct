[workspace]
members = ["utils/client", "utils/host"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
authors = ["ratankaliani", "zachobront", "fakedev9999", "yuwen01"]
homepage = "https://succinctlabs.github.io/op-succinct/"
repository = "https://github.com/succinctlabs/op-succinct"
version = "4.3.1"

[workspace.dependencies]
# general
anyhow = { version = "1.0.98", default-features = false }
async-trait = "0.1.88"
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
spin = { version = "0.10.0" }
tracing = { version = "0.1.41", default-features = false }
tempfile = "3.10.1"

# kona
kona-derive = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
kona-driver = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
kona-preimage = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false, features = [
    "rkyv",
    "serde",
    "std",
] }
kona-executor = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
kona-proof = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
kona-host = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
kona-protocol = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
kona-registry = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
kona-genesis = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }

# op-succinct
op-succinct-client-utils = { path = "utils/client" }
op-succinct-host-utils = { path = "utils/host" }

# Alloy
alloy-eips = { version = "1.8.3", default-features = false, features = ["kzg"] }
alloy-rlp = { version = "0.3.15", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }
alloy-consensus = { version = "1.6.3", default-features = false }

# Keccak with the SHA3 patch is more efficient than the default Keccak.
alloy-primitives = { version = "1.5.7", default-features = false, features = [
    "sha3-keccak",
] }

# OP Alloy - from the optimism monorepo to match kona op-reth/v1.11.5
op-alloy-consensus = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }

# Execution
alloy-evm = { version = "0.27.3", default-features = false }
alloy-op-evm = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5", default-features = false }
# Use kzg-rs and substrate-bn for the zkVM. Versions aligned with op-reth/v1.11.5.
revm = { version = "34.0.0", default-features = false, features = ["bn"] }
revm-precompile = { version = "32.1.0", default-features = false }
op-revm = { version = "15.0.0", default-features = false }

# kzg
kzg-rs = { version = "0.2.8", features = ["rkyv", "serde"] }
c-kzg = { version = "2.0.0", default-features = false }

[profile.release-client-lto]
inherits = "release"
panic = "abort"
codegen-units = 1
lto = "fat"

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.0.0" }
substrate-bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.0.0-substrate-bn" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }

# Patch op-alloy to use the optimism monorepo versions.
# Required because kona op-reth/v1.11.5 uses path deps from the monorepo.
alloy-op-hardforks = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5" }
op-alloy = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5" }
op-alloy-consensus = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5" }
op-alloy-rpc-types = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5" }
op-alloy-rpc-types-engine = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v1.11.5" }
